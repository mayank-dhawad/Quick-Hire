    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="240" cy="240" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="44" filter="url(#glow)" />
  <circle cx="240" cy="240" r="90" fill="#0b1e30" />
