<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2942" />
    <meta name="description" content="QuickHire is a secure, accessible rural digital public infrastructure platform connecting rural workers, employers, and agricultural machinery owners across India with 0% middleman commission." />
    <meta name="keywords" content="rural employment, agriculture labor, tractor rental, farm machinery, daily wage workers India, digital public infrastructure" />
    <title>QuickHire — Rural Workforce, Skill Discovery & Agricultural Equipment Platform</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Mobile App Capabilities & Status Bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuickHire" />
    <meta name="application-name" content="QuickHire" />
    <meta name="msapplication-TileColor" content="#0f2942" />

    <!-- Open Graph & Twitter -->
    <meta property="og:title" content="QuickHire — Rural Workforce & Agricultural Equipment Platform" />
    <meta property="og:description" content="Accessible, mobile-first marketplace connecting workers, employers, and machinery rentals with zero middleman commission." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icons/icon-192.png" />

    <!-- Preconnect Google Fonts for High-Speed Mobile Rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
  </head>
  <body>
    <div id="root">
      <!-- High-Performance Native PWA Initialization Screen -->
      <div id="pwa-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f2942;color:#ffffff;font-family:'DM Sans',system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#0f2942,#1a3d60);border:2px solid #FF9933;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(0,0,0,0.4);margin-bottom:16px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FF9933" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="22" x2="21" y2="22"></line>
            <line x1="6" y1="18" x2="6" y2="11"></line>
            <line x1="10" y1="18" x2="10" y2="11"></line>
            <line x1="14" y1="18" x2="14" y2="11"></line>
            <line x1="18" y1="18" x2="18" y2="11"></line>
            <polygon points="12 2 20 7 4 7"></polygon>
          </svg>
        </div>
        <h1 style="font-size:26px;font-weight:900;letter-spacing:-0.5px;margin:0 0 6px 0;">Quick<span style="color:#138808;">Hire</span></h1>
        <p style="font-size:12px;color:#94a3b8;margin:0 0 24px 0;max-width:280px;line-height:1.5;">Rural Workforce & Agricultural Equipment Platform</p>
        <div style="width:36px;height:36px;border:3px solid rgba(255,153,51,0.2);border-top-color:#FF9933;border-radius:50%;animation:qh-spin 0.85s linear infinite;"></div>
        <style>@keyframes qh-spin { to { transform: rotate(360deg); } }</style>
        <noscript>
          <p style="margin-top:20px;font-size:12px;color:#fca5a5;">JavaScript is required to operate the QuickHire Platform.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
