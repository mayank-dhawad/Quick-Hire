name: QuickHire CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "production-hotfix/**"
      - "fix/quickhire-live-hardening-final"

permissions:
  contents: read

concurrency:
  group: quickhire-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=dot
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-secret
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-secret

  supabase-migrations-and-integrity:
    name: Supabase migrations and database integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Keep the CLI on its supported v2 maintenance line while avoiding
          # setup-cli@v1's GitHub-release lookup (which is rate-limited in PR CI).
          version: v2.stable

      - name: Use an isolated database port for CI
        run: sed -i 's/^port = 54322$/port = 54332/' supabase/config.toml

      - name: Start local Supabase test stack
        run: supabase start

      - name: Rebuild database from every committed migration
        run: supabase db reset

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated database test fixtures
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/01_test_setup.sql

      - name: Run lifecycle and payment integrity tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/02_test_execution.sql

      - name: Run profile privacy and security regression tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/06_phase4r_security_and_integrity_tests.sql

      - name: Verify Auth signup creates a valid profile
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/07_auth_profile_trigger_regression.sql

      - name: Verify private profile fields and owner-only access
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/08_private_profile_fields_regression.sql

      - name: Verify legacy OTP table is inaccessible to app roles
        run: psql "postgresql://postgres:postgres@127.0.0.1:54332/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/09_legacy_otp_security_regression.sql

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was not installed; nothing to stop."
          fi
